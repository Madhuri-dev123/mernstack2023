<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="./quiz.css">

</head>
<body>
    <div class="navbar">Welcome to Quiz</div>
    <div class="quiz-container">
        <div class="progress-bar">
            <div  class="progress-bar-fill" id="progress" ></div>
        </div>
        <div class="content" >
            <div class="question" id="question">Quation will appear here</div>
        <div class="options" id="options"></div>
        </div>

        <div class="retry" id="retry" style="display: none;">
            <button onclick="">Retry Quiz</button>
        </div>
    </div>

    <script>
        const quizData = [
            {question:"What is Js",options:["programming language","Database","stylesheet","markup language"],answer:0},
            {question:"What is Js",options:["programming language","Database","stylesheet","markup language"],answer:0},
            {question:"What is Js",options:["programming language","Database","stylesheet","markup language"],answer:0},
            {question:"What is Js",options:["programming language","Database","stylesheet","markup language"],answer:0},
            {question:"What is Js",options:["programming language","Database","stylesheet","markup language"],answer:0},
            {question:"What is Js",options:["programming language","Database","stylesheet","markup language"],answer:0},
            {question:"What is Js",options:["programming language","Database","stylesheet","markup language"],answer:0},
            {question:"What is Js",options:["programming language","Database","stylesheet","markup language"],answer:0},
            {question:"What is Js",options:["programming language","Database","stylesheet","markup language"],answer:0},
            {question:"What is Js",options:["programming language","Database","stylesheet","markup language"],answer:0},
            {question:"What is Js",options:["programming language","Database","stylesheet","markup language"],answer:0},
            {question:"What is Js",options:["programming language","Database","stylesheet","markup language"],answer:0},
            
            ];

            
            const questionE1 = document.getElementById("question")
            const optionsE1 = document.getElementById("options");

            const progressBarFill = document.getElementById("progress");
            const retryE1 = document.getElementById("retry");


            let currentQuationIndex = 0;
            let score = 0;
            let attempts = 0;

            function loadQuestion(){
                const currentQuestion = quizData[currentQuationIndex];
                questionE1.textContent = currentQuestion.question;
                optionsE1.innerHTML="";
                currentQuestion.options.forEach((option,index)=>{

                    const optionE1 = document.createElement("div");
                    optionE1.textContent=option;
                    optionE1.classList.add("option");
                    optionE1.addEventListener("click",()=>selectOption(index));
                    optionE1.appendChild(optionE1);
                })
            }

            function selectOption(){
                const currentQuestion = quizData[currentQuationIndex]
                const options = document.querySelectorAll(".option")
                 
                  if(selectedIndex===currentQuestion.answer)
                  {
                    options[selectedIndex0].classList.add("correct");
                    score++;
                  }
                  else{
                    options[selectedIndex].classList.add("wrong");
                    options[currentQuestion.answer].classList.add("correct");
                    score--;
                  }

                  setTimeout(()=>{
                    currentQuationIndex++;
                    if(currentQuationIndex < quizData.length)

                    {
                        updateProgressBar();
                        loadQuestion();

                    }
                    else{
                        showResults()
                    }
                  },2000 )
                    }
                function updateProgressBar()
                {
                    const progress=((currentQuationIndex+1)/quizData.length)*100;
                    progressBarFill.style.width=progress+"%";
                }

                function showResults(){
                    questionE1.textContent=`quiz completed your score is ${score}/${quizData.length}`;
                    optionsE1.innerHTML="";
                    if(score <8 && attempts <1)
                {
                    retryE1.style.display = "block";
                }

                else{
                    retryE1.style.display="none";
                }
                }
                function retryQuiz()
                {
                    attempts++;
                    if(attempts<=1)
                {
                    currentQuationIndex=0;
                    score=0;
                    retryE1.style.display="none";
                    loadQuestion();
                    updateProgressBar();
                }
                else
                {
                    questionE1.textContent="no more attempts";
                    optionsE1.innerHTML="";
                    retryE1.style.display="none";
                }
                }
                loadQuestion();
                updateProgressBar();

            
    </script>

</body>
</html>
