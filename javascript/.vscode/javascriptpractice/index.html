<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./data.js"></script>
    <link rel="stylesheet" href="./styles.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body>
    <button class="btn btn-success m-2" onclick="sortbyPriceAsc()">sort by price in high to low</button>
    <button class="btn btn-danger m-2" onclick="sortbyPriceDsc()">sort by price in low to high</button>
    <ul id="products"></ul>
    <script>
        function genUI(){
        products.forEach(function(product){
        let productli = document.createElement("li");
        productli.innerHTML=product.title;

        let productimg = document.createElement("img");
        productimg.src=product.image;
        productimg.style.width="200px";
        productli.appendChild(productimg);

        let producth2 = document.createElement("h2")
        producth2.innerHTML= "Price: Rs."+product.price;
        productli.appendChild(producth2)
        document.getElementById("products").appendChild(productli)

        })
    }
    genUI();

           function sortbyPriceAsc(){
            document.getElementById("products").innerHTML="";
            products.sort(
                (a,b)=>{
                    if(a.price>b.price)
                    {
                        return -1
                    }
                    else
                    {
                        return 1

                    }
                }
            ).forEach(function(product){
                
        let productli = document.createElement("li");
        productli.innerHTML=product.title;

        let productimg = document.createElement("img");
        productimg.src=product.image;
        productimg.style.width="200px";
        productli.appendChild(productimg);

        let producth2 = document.createElement("h2")
        producth2.innerHTML= "Price:Rs."+product.price;
        productli.appendChild(producth2)
        document.getElementById("products").appendChild(productli)

        })
        genUI()
           }

           function sortbyPriceDsc(){
            document.getElementById("products").innerHTML="";
            products.sort(
                (a,b)=>{
                    if(a.price>b.price)
                    {
                        return 1
                    }
                    else
                    {
                        return -1

                    }
                }
            ).forEach(function(product){
                
        let productli = document.createElement("li");
        productli.innerHTML=product.title;

        let productimg = document.createElement("img");
        productimg.src=product.image;
        productimg.style.width="200px";
        productli.appendChild(productimg);

        let producth2 = document.createElement("h2")
        producth2.innerHTML= "Price:Rs."+product.price;
        productli.appendChild(producth2)
        document.getElementById("products").appendChild(productli)

        })
        genUI()
           }
    </script>
</body>
</html>
