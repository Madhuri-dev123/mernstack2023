<style>
    input{
        width: 30px;
        border:0px solid;
        border-bottom: 2px solid;
        margin: 10px;
        outline: 0px;
        text-align: center;
    }
</style>
<body>
    <input type="text" onkeyup="abc(event)">
    <input type="text"  onkeyup="abc(event)">
    <input type="text"  onkeyup="abc(event)">
    <input type="text"  onkeyup="abc(event)">

  function abc(e){
    e.target.nextElementSibling.focus()
  }
    </script>
</body>
